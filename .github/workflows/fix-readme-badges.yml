name: Fix README badges

on:
  push:
    branches:
      - agent/add-codecov-coverage
    paths:
      - .github/workflows/fix-readme-badges.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-codecov-coverage

      - name: Replace broken badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = """[![CI](https://github.com/p95max/docflow_api/actions/workflows/ci.yml/badge.svg?branch=master)](https://github.com/p95max/docflow_api/actions/workflows/ci.yml)
          [![CodeQL](https://github.com/p95max/docflow_api/actions/workflows/codeql-analysis.yml/badge.svg?branch=prod)](https://github.com/p95max/docflow_api/actions/workflows/codeql-analysis.yml)
          [![Coverage](https://codecov.io/gh/p95max/docflow_api/branch/prod/graph/badge.svg)](https://codecov.io/gh/p95max/docflow_api)
          """
          new = """[![Tests](https://github.com/p95max/docflow_api/actions/workflows/tests.yml/badge.svg?branch=master)](https://github.com/p95max/docflow_api/actions/workflows/tests.yml)
          [![Coverage](https://codecov.io/gh/p95max/docflow_api/branch/master/graph/badge.svg)](https://codecov.io/gh/p95max/docflow_api)
          """
          if old not in text:
              raise SystemExit("Expected broken badge block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit badge repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: fix README status badges"
          git push origin HEAD:agent/add-codecov-coverage
