name: Tests

on:
  push:
    branches:
      - master
      - feature/**
      - agent/**
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure local environment
        run: cp .env.example .env

      - name: Run test suite
        shell: bash
        run: |
          log_file=/tmp/docsflow-pytest.log
          if ! docker compose run --rm api pytest -q --tb=short >"$log_file" 2>&1; then
            tail -n 250 "$log_file"
            exit 1
          fi
          cat "$log_file"
