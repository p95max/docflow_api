name: Tests

on:
  push:
    branches:
      - master
      - feature/**
      - agent/**
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure local environment
        run: cp .env.example .env

      - name: Run test suite
        run: docker compose run --rm api pytest
