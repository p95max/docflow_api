<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DocsFlow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/app.css" rel="stylesheet">
    {% block head %}{% endblock %}
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-dark docsflow-navbar shadow-sm">
      <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-semibold me-auto" href="{% if current_user %}/documents{% else %}/login{% endif %}">DocsFlow</a>
        <div class="d-flex align-items-center gap-2">
          {% if current_user %}
            <a class="btn btn-sm btn-outline-light" href="/documents">Documents</a>
            {% if knowledge_enabled %}
              <a class="btn btn-sm btn-outline-light" href="/knowledge">Document chat</a>
            {% else %}
              <span class="btn btn-sm btn-outline-secondary disabled" aria-disabled="true" title="Document chat is disabled">Document chat</span>
            {% endif %}
            <a class="btn btn-sm btn-outline-light" href="/backups">Backups</a>
            <a class="btn btn-sm btn-light" href="/documents/upload">Upload</a>
            <form method="post" action="/logout" class="m-0">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
            </form>
          {% else %}
            <a class="btn btn-sm btn-outline-light" href="/login">Log in</a>
            <a class="btn btn-sm btn-light" href="/register">Create account</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container py-4 py-lg-5">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
