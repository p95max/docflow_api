<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DocsFlow{% endblock %}</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/assets/css/app.css" rel="stylesheet">
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="docsflow-navbar" aria-label="Primary navigation">
      <div class="container docsflow-nav-inner">
        <a class="docsflow-brand" href="{% if current_user %}/documents{% else %}/login{% endif %}">
          <span class="docsflow-brand-mark" aria-hidden="true">DF</span>
          <span>DocsFlow</span>
        </a>
        <div class="docsflow-nav-actions">
          {% if current_user %}
            <a class="btn btn-sm btn-outline-light" href="/documents">Documents</a>
            {% if knowledge_enabled %}
              <a class="btn btn-sm btn-outline-light docsflow-ai-nav" href="/knowledge">
                <span class="docsflow-ai-icon" aria-hidden="true">AI</span>
                <span>Ask Documents</span>
              </a>
            {% else %}
              <span class="btn btn-sm btn-outline-secondary disabled docsflow-ai-nav" aria-disabled="true" title="Ask Documents is disabled">
                <span class="docsflow-ai-icon" aria-hidden="true">AI</span>
                <span>Ask Documents</span>
              </span>
            {% endif %}
            <a class="btn btn-sm btn-outline-light" href="/backups">Backups</a>
            <a class="btn btn-sm btn-light" href="/documents/upload">Upload</a>
            <form method="post" action="/logout" class="m-0">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
            </form>
          {% else %}
            <a class="btn btn-sm btn-outline-light" href="/login">Log in</a>
            <a class="btn btn-sm btn-light" href="/register">Create account</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container docsflow-main">
      {% block content %}{% endblock %}
    </main>
    <script data-form-feedback>
      (() => {
        const controlSelector = "input, select, textarea";
        document.addEventListener("invalid", (event) => {
          if (event.target.matches(controlSelector)) {
            event.target.classList.add("is-invalid");
          }
        }, true);
        document.addEventListener("input", (event) => {
          if (event.target.matches(controlSelector) && event.target.checkValidity()) {
            event.target.classList.remove("is-invalid");
          }
        });
        document.addEventListener("submit", (event) => {
          const form = event.target;
          if (!(form instanceof HTMLFormElement) || !form.checkValidity()) return;
          if (form.dataset.submitting === "true") {
            event.preventDefault();
            return;
          }
          const submitter = event.submitter;
          if (!(submitter instanceof HTMLButtonElement) || submitter.type !== "submit") return;
          form.dataset.submitting = "true";
          form.setAttribute("aria-busy", "true");
          submitter.disabled = true;
          submitter.textContent = submitter.dataset.loadingLabel || "Working…";
        });
      })();
    </script>
  </body>
</html>
